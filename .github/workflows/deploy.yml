name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    environment: production
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Sync files to server via rsync
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'backend/node_modules/' \
            --exclude 'backend/dist/' \
            --exclude 'backend/.env' \
            ./ "$USER@$HOST:/home/locko-admin/randevu-paneli/"

      - name: Restart and verify service
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" bash -c "'
            set -eu
            cd /home/locko-admin/randevu-paneli/backend
            docker compose up -d --build
            echo \"Konteyner saglik kontrolu yapiliyor...\"
            sleep 4
            docker exec randevu-api wget -qO- http://127.0.0.1:3000/health
            echo \"Dagitim basariyla tamamlandi!\"
          '"
