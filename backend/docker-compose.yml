services:
  randevu-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: randevu-api:latest
    container_name: randevu-api
    restart: always
    volumes:
      - ..:/app/public:ro
    networks:
      - edge_proxy
      - vitrinos_internal
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://vitrinos_app:ef52fa7716e78fddd9ff78a9f2a72a2c38e2a267bd8dcb68e809173a738de12b@vitrinos-postgres-1:5432/randevu_paneli?schema=public
      - JWT_SECRET=randevu-paneli-super-secure-jwt-secret-key-2026-production
      - STATIC_FILES_PATH=/app/public
      - CORS_ORIGIN=*
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge_proxy"
      - "traefik.http.routers.randevu.rule=Host(`randevu.n8n-mustafa.me`)"
      - "traefik.http.routers.randevu.entrypoints=websecure"
      - "traefik.http.routers.randevu.tls=true"
      - "traefik.http.routers.randevu.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.randevu.service=randevu-api"
      - "traefik.http.services.randevu-api.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge_proxy:
    external: true
  vitrinos_internal:
    external: true
