services:
  randevu-db:
    image: postgres:17-alpine
    container_name: randevu-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-randevu_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-randevu_db_pass_2026_secure}
      POSTGRES_DB: ${DB_NAME:-randevu_paneli}
    volumes:
      - randevu_postgres_data:/var/lib/postgresql/data
    networks:
      - randevu_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-randevu_app} -d ${DB_NAME:-randevu_paneli} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  randevu-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: randevu-api:latest
    container_name: randevu-api
    restart: always
    depends_on:
      randevu-db:
        condition: service_healthy
    volumes:
      - ..:/app/public:ro
    networks:
      - edge_proxy
      - randevu_internal
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://${DB_USER:-randevu_app}:${DB_PASSWORD:-randevu_db_pass_2026_secure}@randevu-db:5432/${DB_NAME:-randevu_paneli}?schema=public}
      - JWT_SECRET=${JWT_SECRET:-randevu-paneli-super-secure-jwt-secret-key-2026-production}
      - STATIC_FILES_PATH=/app/public
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CHATBOT_API_KEY=${CHATBOT_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge_proxy"
      - "traefik.http.routers.randevu.rule=Host(`randevu.n8n-mustafa.me`)"
      - "traefik.http.routers.randevu.entrypoints=websecure"
      - "traefik.http.routers.randevu.tls=true"
      - "traefik.http.routers.randevu.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.randevu.service=randevu-api"
      - "traefik.http.services.randevu-api.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  randevu_postgres_data:
    name: randevu_postgres_data

networks:
  edge_proxy:
    external: true
  randevu_internal:
    name: randevu_internal
